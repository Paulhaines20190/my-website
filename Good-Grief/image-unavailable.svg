<!-- Local image fallback used when external media cannot load. The viewBox defines scalable geometry; the rectangle and centred text remain readable without a network request. -->
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320"><rect width="480" height="320" fill="#fff8e7"/><text x="240" y="160" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#171717">Image unavailable</text></svg>